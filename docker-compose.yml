services:
  web:
    build: .
    image: nsec3-audit:latest
    environment:
      PORT: "8080"
      AUDIT_DB: /data/audits.json
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys,os; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  # 一次性验收服务：等待 web 健康后执行构建检查、代码测试、核心场景与
  # 针对 http://web:8080 的 API/HTTP 冒烟，随后退出，退出码即验收结果。
  # 手动执行： docker compose run --rm verify
  verify:
    image: nsec3-audit:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:8080
      AUDIT_DB: /data/verify.json
    entrypoint: ["./verify"]
    restart: "no"

volumes:
  audit-data:
